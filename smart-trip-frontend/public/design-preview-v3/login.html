<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>进入你的旅程 · SmartTrip 登录设计预览</title>
    <link rel="stylesheet" href="login.css" />
    <script src="login.js" defer></script>
  </head>
  <body>
    <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-route" viewBox="0 0 24 24"><path d="M6 5a2 2 0 1 0 0 .1M18 19a2 2 0 1 0 0 .1M6 7v5h12v5" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5" /></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0M4 21v-2a8 8 0 0 1 16 0v2" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3" /></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m16 8-2 6-6 2 2-6Z" /></symbol>
        <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-3 6 3 6-3v17l-6 3-6-3-6 3Zm6-3v17m6-14v17" /></symbol>
        <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3" /><path d="M3 21v-3a6 6 0 0 1 12 0v3ZM16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v3" /></symbol>
        <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3ZM3 3v2m17 15v2" /></symbol>
        <symbol id="i-pin" viewBox="0 0 24 28"><path d="M21 11c0 6-9 15-9 15S3 17 3 11a9 9 0 0 1 18 0Z" /><circle cx="12" cy="11" r="3" /></symbol>
      </defs>
    </svg>
    <a class="skip-link" href="#auth-panel">跳到登录</a>
    <div class="entry-scene">
      <div class="landscape" aria-hidden="true"><img src="assets/login-scenery.png" alt="" width="1672" height="941" fetchpriority="high" /></div>
      <header class="entry-header">
        <a class="brand" href="/" aria-label="SmartTrip 智游伴路首页"><svg class="icon" aria-hidden="true"><use href="#i-route" /></svg><span>SmartTrip<small>智游伴路</small></span></a>
        <nav class="main-nav" aria-label="主导航"><a href="/square">旅行灵感</a><a href="/ai-generate">规划旅行</a><a href="/my-trips">我的路书</a></nav>
        <a class="auth-shortcut" href="#auth-panel">登录 / 注册</a>
        <a class="mobile-explore" href="/square">探索灵感<svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></a>
      </header>
      <main class="entry-main">
        <div class="journey-intro">
          <p class="journey-slogan"><svg class="icon" aria-hidden="true"><use href="#i-spark" /></svg>让旅行更简单，更有意义</p>
          <h1>下一段旅程，<br /><span>从这里</span>开始。</h1>
          <p class="journey-description">收藏心动的路线，规划专属的旅行，<br />遇见更大的世界。</p>
          <a class="journey-link" href="/square"><span class="explore-circle"><svg class="icon" aria-hidden="true"><use href="#i-compass" /></svg></span><span>探索旅行灵感</span><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></a>
        </div>
        <div class="journey-route" aria-label="山间、湖畔和小城的旅行灵感示意，非真实地理路线">
          <svg class="route-thread" viewBox="0 0 340 450" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M14 8C-30 77 28 84 107 130S188 173 169 223 65 278 98 332 178 374 190 419" /></svg>
          <div class="route-stop stop-mountain"><span class="stop-label"><svg class="pin" aria-hidden="true"><use href="#i-pin" /></svg>山间 · 灵感示意</span><div class="route-photo"><img class="photo-mountain" src="assets/login-scenery.png" alt="概念影像中的雪山" width="1672" height="941" /></div></div>
          <div class="route-stop stop-lake"><span class="stop-label"><svg class="pin" aria-hidden="true"><use href="#i-pin" /></svg>湖畔 · 灵感示意</span><div class="route-photo"><img class="photo-lake" src="assets/login-scenery.png" alt="概念影像中的湖面与帆船" width="1672" height="941" /></div></div>
          <div class="route-stop stop-town"><span class="stop-label"><svg class="pin" aria-hidden="true"><use href="#i-pin" /></svg>小城 · 灵感示意</span><div class="route-photo"><img class="photo-town" src="assets/login-scenery.png" alt="概念影像中的湖畔小城" width="1672" height="941" /></div></div>
        </div>
        <section class="auth-panel" id="auth-panel" aria-labelledby="auth-title" tabindex="-1">
          <svg class="travel-stamp" viewBox="0 0 150 95" aria-hidden="true"><circle cx="49" cy="46" r="36" /><circle cx="49" cy="46" r="29" stroke-dasharray="2 5" /><path d="m30 44 16 1 12-16 5 2-7 18 12 6-2 4-14-4-8 14-4-1 3-17-14-3Zm54-20c10 8 21-8 34-2m-31 8c10 8 23-8 34-2m-32 8c10 8 23-8 34-2m-33 8c10 8 23-8 34-2m-34 8c10 8 23-8 34-2" /></svg>
          <h2 id="auth-title">欢迎回来</h2>
          <p class="auth-intro" id="auth-intro">登录，继续你的旅行计划。</p>
          <form id="auth-form">
            <fieldset id="auth-fields">
              <legend class="sr-only" id="auth-legend">登录账号</legend>
              <div class="field"><label for="username">用户名</label><div class="input-wrap"><svg class="input-icon icon" aria-hidden="true"><use href="#i-user" /></svg><input id="username" autocomplete="username" placeholder="3–32位字母、数字或下划线" pattern="[a-zA-Z0-9_]{3,32}" minlength="3" maxlength="32" required aria-describedby="username-hint" /></div><p id="username-hint" class="field-hint" hidden>3–32 位字母、数字或下划线</p></div>
              <div class="field" id="nickname-field" hidden><label for="nickname">昵称<span class="optional">选填</span></label><div class="input-wrap"><svg class="input-icon icon" aria-hidden="true"><use href="#i-user" /></svg><input id="nickname" autocomplete="nickname" placeholder="旅行中，怎么称呼你？" maxlength="50" /></div></div>
              <div class="field"><label for="password">密码</label><div class="input-wrap password-input"><svg class="input-icon icon" aria-hidden="true"><use href="#i-lock" /></svg><input id="password" type="password" autocomplete="current-password" placeholder="输入你的密码，至少8位" minlength="8" maxlength="72" required aria-describedby="password-hint" /><button class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye" /></svg></button></div><p id="password-hint" class="field-hint" hidden>8–72 个字符</p></div>
              <p id="auth-error" class="form-error" role="alert" hidden></p>
              <button class="submit-button" type="button" id="auth-submit"><span>登录</span><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button>
            </fieldset>
          </form>
          <p id="preview-result" class="preview-result" role="status" hidden></p>
          <p class="account-switch"><span id="switch-prompt">还没有账号？</span><button id="mode-switch" type="button">创建账号</button></p>
        </section>
        <nav class="journey-tools" aria-label="旅行功能"><a href="/square"><svg class="icon" aria-hidden="true"><use href="#i-compass" /></svg><span><strong>收藏灵感</strong><small>寻找心动的风景</small></span></a><a href="/ai-generate"><svg class="icon" aria-hidden="true"><use href="#i-map" /></svg><span><strong>规划路线</strong><small>构建自己的旅程</small></span></a><a href="/my-trips"><svg class="icon" aria-hidden="true"><use href="#i-people" /></svg><span><strong>分享路书</strong><small>记录走过的世界</small></span></a></nav>
        <div class="journey-signature" aria-hidden="true">去看更大的世界<svg viewBox="0 0 290 32" preserveAspectRatio="none"><path d="M7 26C67 9 207-8 161 9S125 30 276 20" /></svg></div>
      </main>
      <footer class="entry-footer"><span>静态设计预览 · 不发送或保存账号信息</span><span id="image-caption">旅行概念影像 · 非目的地实拍</span></footer>
    </div>
    <noscript><p class="no-script">开启 JavaScript 后可体验登录与注册切换。此设计预览不会发送账号信息。</p></noscript>
  </body>
</html>
