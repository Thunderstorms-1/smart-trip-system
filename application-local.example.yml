# Copy to .local/application-local.yml and fill only local credentials.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_trip_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: YOUR_LOCAL_DB_USER
    password: YOUR_LOCAL_DB_PASSWORD
  data:
    redis:
      host: localhost
      port: 6379
security:
  jwt-secret: REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES
ai:
  llm:
    enabled: ${SMARTTRIP_AI_ENABLED:false}
    free-quota-verified: ${SMARTTRIP_AI_FREE_QUOTA_VERIFIED:false}
    base-url: ${SMARTTRIP_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${SMARTTRIP_AI_KEY:}
    model: ${SMARTTRIP_AI_MODEL:qwen3.8-flash}
    max-output-tokens: ${SMARTTRIP_AI_MAX_OUTPUT_TOKENS:8192}
geo:
  enabled: false
  poi-enabled: false
  route-enabled: false
  weather-enabled: false
  map-enabled: false
  free-quota-verified: false
  amap-key: ''
  amap-js-key: ''
  amap-security-key: ''
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
logging:
  level:
    com.smarttrip: INFO
storage:
  upload-dir: ../.local/uploads
