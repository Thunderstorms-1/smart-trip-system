# Optional source example only. Do not replace the existing compose.yaml or .env.
# Backend URLs must be reachable FROM its container, not the host loopback.
services:
  backend:
    environment:
      SMARTTRIP_RAG_ENABLED: ${SMARTTRIP_RAG_ENABLED:-false}
      SMARTTRIP_RAG_FALLBACK: ${SMARTTRIP_RAG_FALLBACK:-true}
      SMARTTRIP_RAG_ES_URL: ${SMARTTRIP_RAG_ES_URL:?Set an ES URL reachable from the backend container}
      SMARTTRIP_RAG_ES_USERNAME: ${SMARTTRIP_RAG_ES_USERNAME:-elastic}
      SMARTTRIP_RAG_ES_PASSWORD: ${SMARTTRIP_RAG_ES_PASSWORD:?Use the existing RAG ES password}
      SMARTTRIP_RAG_INDEX: ${SMARTTRIP_RAG_INDEX:-smarttrip-travel-v1}
      SMARTTRIP_RAG_EMBEDDING_URL: ${SMARTTRIP_RAG_EMBEDDING_URL:?Set an Ollama URL reachable from the backend container}
      SMARTTRIP_RAG_EMBEDDING_MODEL: ${SMARTTRIP_RAG_EMBEDDING_MODEL:-bge-m3}
      SMARTTRIP_RAG_EMBEDDING_VERSION: ${SMARTTRIP_RAG_EMBEDDING_VERSION:-v1}
      SMARTTRIP_RAG_EMBEDDING_TIMEOUT_MS: ${SMARTTRIP_RAG_EMBEDDING_TIMEOUT_MS:-4000}
      SMARTTRIP_RAG_RETRIEVAL_TIMEOUT_MS: ${SMARTTRIP_RAG_RETRIEVAL_TIMEOUT_MS:-6000}
      SMARTTRIP_RAG_INGESTION_TIMEOUT_MS: ${SMARTTRIP_RAG_INGESTION_TIMEOUT_MS:-120000}
      SMARTTRIP_RAG_TOP_K: ${SMARTTRIP_RAG_TOP_K:-10}
      SMARTTRIP_RAG_CONTEXT_TOP_K: ${SMARTTRIP_RAG_CONTEXT_TOP_K:-5}
      SMARTTRIP_RAG_RRF_K: ${SMARTTRIP_RAG_RRF_K:-60}
      SMARTTRIP_RAG_CONTEXT_TOKENS: ${SMARTTRIP_RAG_CONTEXT_TOKENS:-1800}
      SMARTTRIP_RAG_MAX_SOURCE_AGE_DAYS: ${SMARTTRIP_RAG_MAX_SOURCE_AGE_DAYS:-1095}
      SMARTTRIP_RAG_CHUNK_TOKENS: ${SMARTTRIP_RAG_CHUNK_TOKENS:-384}
      SMARTTRIP_RAG_CHUNK_OVERLAP: ${SMARTTRIP_RAG_CHUNK_OVERLAP:-48}
      SMARTTRIP_RAG_RERANK_ENABLED: ${SMARTTRIP_RAG_RERANK_ENABLED:-false}
      SMARTTRIP_RAG_RERANK_URL: ${SMARTTRIP_RAG_RERANK_URL:-http://127.0.0.1:8010/rerank}
      SMARTTRIP_RAG_RERANK_TIMEOUT_MS: ${SMARTTRIP_RAG_RERANK_TIMEOUT_MS:-1500}
